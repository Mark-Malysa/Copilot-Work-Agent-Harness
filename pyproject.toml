[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cwah"
version = "0.1.0"
description = "A safe manual clipboard harness for Microsoft Copilot"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["typer>=0.12", "rich>=13", "pydantic>=2", "pyperclip>=1.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pyinstaller>=6"]

[project.scripts]
cwah = "cwah.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cwah"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cwah"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
